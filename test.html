  async function fetchAvailableSlotsRange(serviceType) {
      if (!availableSlotsContainer || !loadingSlotsIndicator) {
          console.error("Missing elements for displaying slots range.");
          return;
      }

      loadingSlotsIndicator.classList.remove('hidden');
      availableSlotsContainer.innerHTML = ''; // Clear previous slots
      availableSlotsContainer.appendChild(loadingSlotsIndicator); // Show loading
      if (messagesDiv) messagesDiv.textContent = '';
      fetchedSlotsRange = {}; // Clear previous results
      resetOtherBooking(); // Reset any previously selected slot/cost

      try {
          const response = await fetch(`${backendApiUrl}/api/bookings/available-slots-range?serviceType=${serviceType}&days=${SLOT_RANGE_DAYS}`);
          if (!response.ok) {
              const errorData = await response.json();
              throw new Error(errorData.message || `HTTP error! status: ${response.status}`);
          }
          fetchedSlotsRange = await response.json();

          displaySlotsRange();

      } catch (error) {
          console.error('Error fetching slots range:', error);
          loadingSlotsIndicator.classList.add('hidden');
          if (availableSlotsContainer) {
              availableSlotsContainer.innerHTML = `<p class="error">Could not load availability: ${error.message}. Please try again later.</p>`;
          }
      }
  }

  // *** NEW: Function to display the fetched slots range ***
  function displaySlotsRange() {
      if (!availableSlotsContainer || !loadingSlotsIndicator) return;

      loadingSlotsIndicator.classList.add('hidden'); // Hide loading
      availableSlotsContainer.innerHTML = ''; // Clear placeholder/loading

      const sortedDates = Object.keys(fetchedSlotsRange).sort(); // Sort dates chronologically

      if (sortedDates.length === 0 || sortedDates.every(date => fetchedSlotsRange[date].length === 0)) {
          availableSlotsContainer.innerHTML = '<p>No available slots found on the selected day.</p>';
          return;
      }

      sortedDates.forEach(dateStr => {
          const slots = fetchedSlotsRange[dateStr];
          if (slots.length > 0) {
              const dateHeader = document.createElement('h4');
              // Format date for display (e.g., "Mon, Sep 16")
              const dateObj = new Date(dateStr + 'T00:00:00'); // Parse as local date
              dateHeader.textContent = dateObj.toLocaleDateString([], { weekday: 'short', month: 'short', day: 'numeric' });
              dateHeader.style.marginTop = '15px'; // Add some spacing
              availableSlotsContainer.appendChild(dateHeader);

              slots.forEach(slot => {
                  const start = new Date(slot.start);
                  const end = new Date(slot.end);
                  const div = document.createElement('div');
                  div.classList.add('slot');
                  div.dataset.start = slot.start;
                  div.dataset.end = slot.end;
                  div.innerHTML = `
                      <span>${start.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' })} - ${end.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' })}</span>
                      `;
                      // <span>${start.toLocaleDateString()}</span> // Date is now in the header
                  availableSlotsContainer.appendChild(div);
              });
          }
          // Optional: Could add a message like "No slots available for [Date]" if slots array is empty for a date within the range
          else {
                const noSlotsMsg = document.createElement('p');
                noSlotsMsg.textContent = `No slots available for ${new Date(dateStr + 'T00:00:00').toLocaleDateString([], { weekday: 'short', month: 'short', day: 'numeric' })}`;
              noSlotsMsg.style.fontStyle = 'italic';
                noSlotsMsg.style.color = '#888';
                availableSlotsContainer.appendChild(noSlotsMsg);
           }
      });
  }

  async function fetchAndDisplayCurrentCapacity(scheduleId, capacitySpanId) {
    const capacitySpan = document.getElementById(capacitySpanId);
    if (!capacitySpan) return;
    if (!checkStartDate) { // If no start date is provided, don't fetch
         capacitySpan.textContent = "(Select Start Date)"; return;
    }

    capacitySpan.textContent = "(Checking...)"; // Update placeholder

    const token = localStorage.getItem('authToken');
        if (!token) { // Need auth if endpoint is protected
             capacitySpan.textContent = "(Login required)";
             return;
        }

    try {

 const response = await fetch(
            `${backendApiUrl}/api/bookings/rolling-slot-availability?scheduleId=${scheduleId}&checkStartDate=${checkStartDate}`,
            {
                headers: {
                    'Authorization': `Bearer ${token}`,
                    'ngrok-skip-browser-warning': 'true'
                }
            }
        );

        if (!response.ok) {
            console.error(`Failed to fetch capacity for ${scheduleId}: ${response.status}`);
            capacitySpan.textContent = "(Error)";
            return;
        }

        const availabilityData = await response.json();
        console.log("Received availability for", scheduleId, availabilityData);

        if (availabilityData.minRemainingCapacityInPeriod !== undefined) {
            if (availabilityData.minRemainingCapacityInPeriod <= 0 && availabilityData.checkedFutureDatesInPeriod > 0) { // Check if there were future dates
                capacitySpan.textContent = `(Full for this 6-week period)`;
                capacitySpan.style.color = 'red';
                // Optionally disable checkbox
            } else if (availabilityData.checkedFutureDatesInPeriod === 0) {
                capacitySpan.textContent = `(No upcoming in 6-week period)`;
                capacitySpan.style.color = 'orange';
            }
             else {
                capacitySpan.textContent = `(Min. Available: ${availabilityData.minRemainingCapacityInPeriod}/${availabilityData.maxCapacity})`;
                capacitySpan.style.color = 'green';
            }
        } else { capacitySpan.textContent = "(Info unavailable)"; }

    } catch (error) {
        console.error(`Error fetching capacity for ${scheduleId}:`, error);
        capacitySpan.textContent = "(Error)";
    }
}

   // --- *** NEW/REVISED: Updates both payment display areas for Playgroup *** ---
   async function updatePlaygroupPaymentDisplays() {
      const paymentOptionsDiv = document.getElementById('playgroup-payment-options-display');
      const fullPaymentSummaryBox = document.getElementById('playgroup-cost-summary');
      const installmentDetailsBox = document.getElementById('installment-details');

      if (!paymentOptionsDiv || !fullPaymentSummaryBox || !installmentDetailsBox) return; // Ensure elements exist

      // Hide both initially if no days selected
      if (!playgroupSelections.startDate || playgroupSelections.daysBitmask === 0) {
        if (paymentOptionsDiv) paymentOptionsDiv.classList.add('hidden');
        return; // Exit if not enough info
    }
    if (paymentOptionsDiv) paymentOptionsDiv.classList.remove('hidden');
      // Show the container
      fullPaymentSummaryBox.classList.add('hidden'); // Hide specific boxes until calculated
      installmentDetailsBox.classList.add('hidden');

      // --- Calculate Full Payment Cost (for display) ---
      let calculatedFullCost = null;
      try {
        const response = await fetch(`${backendApiUrl}/api/pricing/calculate-rolling-playgroup`, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'ngrok-skip-browser-warning': 'true' // If using ngrok
            },
            body: JSON.stringify({
                startDate: playgroupSelections.startDate, // YYYY-MM-DD string
                daysPerWeekBitmask: playgroupSelections.daysBitmask,
                paymentType: 'full' // Always calculate 'full' cost for this section
            })
        });
          if (!response.ok) throw new Error('Failed to calculate cost');
          calculatedFullCost = await response.json();

          // Display Full Payment Details
          populatePlaygroupFullCostUI(calculatedFullCost); // Use helper
          fullPaymentSummaryBox.classList.remove('hidden');

      } catch (error) {
          console.error('Error calculating playgroup cost for display:', error);
          if (messagesDiv) messagesDiv.textContent = `Error calculating cost: ${error.message}`;
          // Hide the full payment box on error
          fullPaymentSummaryBox.classList.add('hidden');
      }

      // --- Display Installment Info ---
      populatePlaygroupInstallmentUI(); // Use helper
      installmentDetailsBox.classList.remove('hidden');

      // Update overall checkout button state
      checkBookingLoginStatus();
  }

  function highlightSlotsForDate(dateStrToHighlight) { // dateStr is "YYYY-MM-DD"
       if (!availableSlotsContainer) return;
       availableSlotsContainer.querySelectorAll('.slot').forEach(slotDiv => {
           const slotStartDate = new Date(slotDiv.dataset.start).toISOString().split('T')[0];
           if (slotStartDate === dateStrToHighlight) {
               slotDiv.style.backgroundColor = '#e0f7ff'; // Example highlight
               slotDiv.style.border = '1px solid #007bff';
           } else {
               slotDiv.style.backgroundColor = ''; // Remove highlight
               slotDiv.style.border = '';
           }
       });
        // Optional: Scroll to the first highlighted slot or the date header
        const firstMatch = availableSlotsContainer.querySelector(`.slot[data-start^="${dateStrToHighlight}"]`);
        if(firstMatch) {
            firstMatch.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }
   }

   async function fetchAndDisplaySingleDateSlots(serviceType, date) {
    if (!availableSlotsContainer || !loadingSlotsIndicator || !date) return;

    //console.log(`Fetching single date slots for ${serviceType} on ${date}...`);
    loadingSlotsIndicator.classList.remove('hidden');
    availableSlotsContainer.innerHTML = '';
    availableSlotsContainer.appendChild(loadingSlotsIndicator);
    if (messagesDiv) messagesDiv.textContent = '';
    fetchedSlotsRange = {}; // Clear range data

    try {
        // Call the SINGLE date endpoint
        const response = await fetch(`${backendApiUrl}/api/bookings/available-slots?serviceType=${serviceType}&date=${date}`);
        if (!response.ok) {
            const errorData = await response.json();
            throw new Error(errorData.message || `HTTP error! status: ${response.status}`);
        }
        const slots = await response.json(); // Expects an array: [ {start, end}, ... ]

        loadingSlotsIndicator.classList.add('hidden');
        availableSlotsContainer.innerHTML = ''; // Clear loading

        if (slots.length === 0) {
            availableSlotsContainer.innerHTML = '<p>No available slots found for this date.</p>';
        } else {
            // Display slots similar to how displaySlotsRange did, but without date headers
            slots.forEach(slot => {
                const start = new Date(slot.start);
                const end = new Date(slot.end);
                const div = document.createElement('div');
                div.classList.add('slot');
                div.dataset.start = slot.start;
                div.dataset.end = slot.end;
                div.innerHTML = `<span>${start.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' })} - ${end.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' })}</span>`;
                availableSlotsContainer.appendChild(div);
            });
        }
    } catch (error) {
         console.error('Error fetching single date slots:', error);
         loadingSlotsIndicator.classList.add('hidden');
         if (availableSlotsContainer) {
            availableSlotsContainer.innerHTML = '<p class="error">Could not load slots for this date.</p>';
         }
    }
}

    async function fetchAvailableSlots() {
        // Ensure elements exist
        if (!availableSlotsContainer || !loadingSlotsIndicator) return;

        if (!selectedService || selectedService === 'playgroup' || !selectedDate) {
             availableSlotsContainer.innerHTML = '';
             return;
         }

        const openPlayOption = openPlayChoices ? openPlayChoices.querySelector('button.active')?.dataset.option : null;
        if (selectedService === 'openplay' && (openPlayOption === 'punchcard' || openPlayOption === 'membership')) {
            availableSlotsContainer.innerHTML = '';
            return;
        }

         loadingSlotsIndicator.classList.remove('hidden');
         availableSlotsContainer.innerHTML = ''; // Clear previous slots but keep loading indicator structure
         availableSlotsContainer.appendChild(loadingSlotsIndicator);
         if (messagesDiv) messagesDiv.textContent = '';
         resetOtherBooking();

         try {
             const response = await fetch(`${backendApiUrl}/api/bookings/available-slots?serviceType=${selectedService}&date=${selectedDate}`);
             if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
             const slots = await response.json();

             loadingSlotsIndicator.classList.add('hidden'); // Hide loading

             if (slots.length === 0) {
                 availableSlotsContainer.innerHTML = '<p>No available slots for this date.</p>';
             } else {
                 // Clear placeholder/loading before adding slots
                 availableSlotsContainer.innerHTML = '';
                 slots.forEach(slot => {
                     const start = new Date(slot.start);
                     const end = new Date(slot.end);
                     const div = document.createElement('div');
                     div.classList.add('slot');
                     div.dataset.start = slot.start;
                     div.dataset.end = slot.end;
                     div.innerHTML = `
                         <span>${start.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' })} - ${end.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' })}</span>
                         <span>${start.toLocaleDateString()}</span>
                     `;
                     availableSlotsContainer.appendChild(div);
                 });
             }
         } catch (error) {
             console.error('Error fetching slots:', error);
             loadingSlotsIndicator.classList.add('hidden');
             // Check element again before setting innerHTML
             if (availableSlotsContainer) {
                availableSlotsContainer.innerHTML = '<p class="error">Could not load slots. Please try again.</p>';
             }
         }
     }

   async function initiateCheckout() {
      if (!stripe) { if (messagesDiv) messagesDiv.textContent = "Payment system not loaded."; return; }
      if (!authToken) { if (messagesDiv) messagesDiv.textContent = "Please log in first."; return; }
      if (isCheckoutInProgress) return; // Prevent double clicks

      isCheckoutInProgress = true;
      if (checkoutButton) {
          checkoutButton.disabled = true;
          checkoutButton.textContent = 'Processing...';
      }
      if (messagesDiv) messagesDiv.textContent = 'Preparing secure checkout...';

      // --- Gather Data based on State ---
      let checkoutData = { serviceType: selectedService };

if (selectedService === 'playgroup') {
    checkoutData = {
        ...checkoutData,
        paymentType: playgroupSelections.paymentType,
        semesterDetails: playgroupSelections.semester,
        daysPerWeekBitmask: playgroupSelections.daysBitmask,
        scheduleIds: playgroupSelections.scheduleIds,
        // Playgroup quantity: If you allow multiple children for semester,
        // you'd need a quantity input for playgroup too.
        // For now, assume quantity 1 for playgroup is handled by existing logic.
        // If adding, backend /create-checkout-session needs to handle playgroup quantity.
        quantity: 1 // Default for playgroup, or get from a playgroup-specific quantity input
    };
} else if (selectedService === 'openplay') {
        const openPlayOption = openPlayChoices?.querySelector('button.active')?.dataset.option;
        checkoutData.openPlayOption = openPlayOption;

        if (openPlayOption === 'dropin') {
            if (!selectedSlot || !selectedSlot.start || !selectedSlot.quantity) { // Ensure selectedSlot has quantity
                if (messagesDiv) messagesDiv.textContent = "Please select a drop-in slot and quantity.";
                isCheckoutInProgress = false;
                if (checkoutButton) { checkoutButton.disabled = false; checkoutButton.textContent = 'Proceed to Checkout'; }
                return;
            }
            // Pass the selectedSlot object which includes start, end, AND quantity
            checkoutData.selectedSlot = selectedSlot; // Backend will use selectedSlot.quantity
        }
        // For 'punchcard' or 'membership', selectedSlot is not relevant for quantity in the same way.
        // Backend assumes quantity 1 for these purchase line items.
        // If you wanted to buy, e.g., 2 punchcards, that would be a different UI/backend logic.

    } else if (selectedService === 'birthday') {
        const partyDuration = 2; // Assuming fixed
        if (!selectedSlot || !selectedSlot.start || !selectedSlot.quantity) { // Ensure selectedSlot has quantity
            if (messagesDiv) messagesDiv.textContent = "Please select a birthday slot.";
            isCheckoutInProgress = false;
            if (checkoutButton) { checkoutButton.disabled = false; checkoutButton.textContent = 'Proceed to Checkout'; }
            return;
        }
        // Pass the selectedSlot object which includes start, end, AND quantity
        checkoutData.selectedSlot = selectedSlot; // Backend will use selectedSlot.quantity
        checkoutData.partyDuration = partyDuration;

    } else {
        if (messagesDiv) messagesDiv.textContent = "Invalid service type selected.";
        isCheckoutInProgress = false;
        if (checkoutButton) { checkoutButton.disabled = false; checkoutButton.textContent = 'Proceed to Checkout'; }
        return;
    }

      try {
          // --- Call the unified backend endpoint ---
          const response = await fetch(`${backendApiUrl}/api/payments/create-checkout-session`, {
              method: 'POST',
              headers: {
                  'Content-Type': 'application/json',
                  'Authorization': `Bearer ${authToken}`
              },
              body: JSON.stringify(checkoutData)
          });

          if (!response.ok) {
              const errorData = await response.json();
              throw new Error(errorData.message || `Failed to initiate checkout (Status: ${response.status})`);
          }

          const { sessionId } = await response.json();

          // --- Redirect to Stripe Checkout ---
          if (sessionId) {
              const { error } = await stripe.redirectToCheckout({ sessionId: sessionId });
              if (error) {
                  // This error typically occurs client-side before the redirect happens
                  throw new Error(`Checkout redirect failed: ${error.message}`);
              }
              // If redirect succeeds, browser navigates away. Code below here may not run reliably.
              // Reset button state in case user navigates back without completing checkout
              // isCheckoutInProgress = false;
              // if (checkoutButton) { checkoutButton.disabled = false; checkoutButton.textContent = 'Proceed to Checkout'; }
          } else {
               throw new Error("No session ID received from server.");
          }

      } catch (error) {
          console.error('Error initiating checkout:', error);
          if (messagesDiv) messagesDiv.textContent = `Error: ${error.message}`;
          isCheckoutInProgress = false; // Re-enable button on error
          if (checkoutButton) {
              checkoutButton.disabled = false;
              // Restore appropriate text based on context
               checkoutButton.textContent = (selectedService === 'playgroup' && playgroupSelections.paymentType === 'installment')
                  ? 'Retry Payment Setup' : 'Proceed to Checkout';
          }
      }
  }

            case 4: case 5: monthlyCost = 520; break; // Example: $520/month for 4/5 days/wk
            default: monthlyCost = 0; break;
       }

       if (monthlyCost > 0) {
           monthlyCostSpan.textContent = `$${monthlyCost.toFixed(2)} / month`;
       } else {
           monthlyCostSpan.textContent = '$TBD (Select days)';
       }
       // You could add logic here to calculate/display number of installments based on semester dates
   }

   // Basic JWT parsing - consider a library for production robustness
  function parseJwt (token) {
      if (!token) return null;
      try {
          return JSON.parse(atob(token.split('.')[1]));
      } catch (e) {
          console.error("Error parsing JWT:", e);
          return null;
      }
  }


  // --- User Authentication Functions ---

  // Helper: Handle Successful Authentication
  function handleAuthSuccess(token, user) {
      localStorage.setItem('authToken', token); // Use consistent key
      localStorage.setItem('userId', user._id);
      localStorage.setItem('username', user.username);

      authToken = token; // Update global variable

      // Update Auth UI section (check elements exist)
      if (loginSection) loginSection.style.display = 'none';
      if (registerSection) registerSection.style.display = 'none';
      if (userStatusDiv) userStatusDiv.style.display = 'block';
      if (loggedInUsernameSpan) loggedInUsernameSpan.textContent = user.username;

      // Update Booking UI section
      checkBookingLoginStatus();
  }

  // Helper: Handle Logout
  function handleLogout() {
      localStorage.removeItem('authToken'); // Use consistent key
      localStorage.removeItem('userId');
      localStorage.removeItem('username');

      authToken = null; // Clear global variable

      // Update Auth UI section (check elements exist)
      if (userStatusDiv) userStatusDiv.style.display = 'none';
      if (loginSection) loginSection.style.display = 'block';
      if (registerSection) registerSection.style.display = 'none';
      if (loginEmailInput) loginEmailInput.value = '';
      if (loginPasswordInput) loginPasswordInput.value = '';

      // Update Booking UI section
      checkBookingLoginStatus();

  }

  // Login Form Submission Handler (async)
  async function handleLoginFormSubmit(event) {
      event.preventDefault();
      // Ensure elements exist
      if (!loginErrorDiv || !loginButton || !loginEmailInput || !loginPasswordInput) return;

      loginErrorDiv.textContent = '';
      loginButton.disabled = true;

      const email = loginEmailInput.value;
      const password = loginPasswordInput.value;

      try {
          const response = await fetch(`${backendApiUrl}/api/users/login`, {
              method: 'POST',
              headers: {
                  'Content-Type': 'application/json',
              },
              body: JSON.stringify({ email, password }),
          });

          const data = await response.json();

          if (!response.ok) {
              throw new Error(data.message || `HTTP error! Status: ${response.status}`);
          }

          handleAuthSuccess(data.token, data.user);

      } catch (error) {
          console.error('Login error:', error);
          loginErrorDiv.textContent = error.message || 'Login failed. Please try again.';
      } finally {
          loginButton.disabled = false;
      }
  }

  // Register Form Submission Handler (async)
  async function handleRegisterFormSubmit(event) {
      event.preventDefault();
      // Ensure elements exist
      if (!registerErrorDiv || !registerButton || !registerUsernameInput || !registerEmailInput || !registerPasswordInput) return;

      registerErrorDiv.textContent = '';
      registerButton.disabled = true;

      const username = registerUsernameInput.value;
      const email = registerEmailInput.value;
      const password = registerPasswordInput.value;

      try {
          const response = await fetch(`${backendApiUrl}/api/users/register`, {
              method: 'POST',
              headers: {
                  'Content-Type': 'application/json'
              },
              body: JSON.stringify({ username, email, password }),
          });

          const data = await response.json();

          if (!response.ok) {
              throw new Error(data.message || `HTTP error! Status: ${response.status}`);
          }

          handleAuthSuccess(data.token, data.user);

      } catch (error) {
          console.error('Registration error:', error);
          registerErrorDiv.textContent = error.message || 'Registration failed. Please try again.';
      } finally {
          registerButton.disabled = false;
      }
  }


  // Renamed: Checks login status specifically for the AUTH UI elements
  function checkAuthUILoginStatus() {
      const currentToken = localStorage.getItem('authToken'); // Use consistent key
      const currentUsername = localStorage.getItem('username');

      // Check if the auth HTML elements actually exist before trying to access style
      const loginSectionExists = !!loginSection; // Check if element was found

      if (currentToken && currentUsername) {
          if (loginSectionExists) {
              loginSection.style.display = 'none';
              if (registerSection) registerSection.style.display = 'none';
              if (userStatusDiv) userStatusDiv.style.display = 'block';
              if (loggedInUsernameSpan) loggedInUsernameSpan.textContent = currentUsername;
          }
      } else {
           if (loginSectionExists) {
              if (userStatusDiv) userStatusDiv.style.display = 'none';
              loginSection.style.display = 'block'; // Show login by default
              if (registerSection) registerSection.style.display = 'none';
          }
      }
  }


  // --- INITIAL EXECUTION ---
  // Run initialize ONCE after all declarations and function definitions
  initialize();

  if(window.location.toString().indexOf("user") != -1){
    // Profile page specific JS
    const profileContent = document.getElementById('profile-content');
    const loadingProfile = document.getElementById('loading-profile');
    const profileError = document.getElementById('profile-error');
    const profileUsername = document.getElementById('profile-username');
    const profileEmail = document.getElementById('profile-email');
    const profilePunches = document.getElementById('profile-punches');
    const profileMembership = document.getElementById('profile-membership');
    const profileSubscriptionStatus = document.getElementById('profile-subscription-status');
    const profileSubEndDateContainer = document.getElementById('profile-sub-end-date');
    const profileSubscriptionEnd = document.getElementById('profile-subscription-end');
    const bookingsList = document.getElementById('upcoming-bookings-list');
    const noBookingsMsg = document.getElementById('no-bookings-msg');
    // const customerPortalLink = document.getElementById('customer-portal-link'); // If using portal

    async function loadProfileData() {
        const token = localStorage.getItem('authToken'); // Assuming stored token
        profileError.textContent = '';

        if (!token) {
            // Redirect to login or show message
            loadingProfile.textContent = '';
            profileError.textContent = 'Please log in to view your account.';
            // window.location.href = '/login'; // Optional redirect
            return;
        }

        try {
            const response = await fetch(`${backendApiUrl}/api/users/me`, { // Use relative URL if on same domain or full URL
                headers: {
                    'Authorization': `Bearer ${token}`
                    
                }
            });

            if (response.status === 401) {
                 // Handle expired/invalid token
                 localStorage.removeItem('authToken');
                 loadingProfile.textContent = '';
                 profileError.textContent = 'Your session has expired. Please log in again.';
                 handleLogout();
                 window.location.href = '/login';
                 return;
            }

            if (!response.ok) {
                const errorData = await response.json();
                throw new Error(errorData.message || `Error loading profile (${response.status})`);
            }

            const data = await response.json();
            //console.log("Profile Data Received:", data); // For debugging

            // Populate User Details
            if (profileUsername) profileUsername.textContent = data.user.username || 'N/A';
            if (profileEmail) profileEmail.textContent = data.user.email || 'N/A';

            // Populate Open Play Status
            if (profilePunches) profilePunches.textContent = data.user.openPlayPunches || 0;
            if (profileMembership) {
                profileMembership.textContent = data.user.membershipExpiry
                    ? new Date(data.user.membershipExpiry).toLocaleDateString()
                    : 'N/A';
            }
            // Populate Subscription Status
            if (profileSubscriptionStatus) {
                let statusText = 'Inactive';
                let statusClass = 'status-inactive';
                if (data.user.hasActiveSubscription) {
                     statusText = data.user.subscriptionStatus || 'Unknown'; // Use status from Stripe
                     if (statusText === 'active') statusClass = 'status-active';
                     else if (statusText === 'past_due' || statusText === 'unpaid') statusClass = 'status-error';
                     // Capitalize first letter
                     statusText = statusText.charAt(0).toUpperCase() + statusText.slice(1).replace(/_/g, ' ');

                     // Show period end date if active
                     if(data.user.subscriptionPeriodEnd && profileSubscriptionEnd && profileSubEndDateContainer) {
                        profileSubscriptionEnd.textContent = new Date(data.user.subscriptionPeriodEnd).toLocaleDateString();
                        profileSubEndDateContainer.style.display = 'block';
                     } else if (profileSubEndDateContainer) {
                        profileSubEndDateContainer.style.display = 'none';
                     }

                } else {
                    if (profileSubEndDateContainer) profileSubEndDateContainer.style.display = 'none';
                }
                profileSubscriptionStatus.textContent = statusText;
                profileSubscriptionStatus.className = statusClass; // Apply class for styling
            }


            // Populate Upcoming Bookings
            if (bookingsList && noBookingsMsg) {
                bookingsList.innerHTML = ''; // Clear any previous
                if (data.upcomingBookings && data.upcomingBookings.length > 0) {
                    noBookingsMsg.style.display = 'none';
                    data.upcomingBookings.forEach(booking => {
                        const li = document.createElement('div');
                        const startDate = new Date(booking.start);
                        const endDate = new Date(booking.end);
                        const serviceName = booking.serviceType.charAt(0).toUpperCase() + booking.serviceType.slice(1);

                        li.innerHTML = `
                            <div class="booking-date">${startDate.toLocaleDateString([], { weekday: 'short', month: 'short', day: 'numeric' })}</div>
                            <div><strong>${serviceName}</strong>: ${startDate.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' })} - ${endDate.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' })}</div>
                            ${booking.details?.option ? `<div class="booking-details">Option: ${booking.details.option}</div>` : ''}
                            ${booking.details?.scheduleId ? `<div class="booking-details">Ref: ${booking.details.scheduleId.slice(-6)}</div>` : ''}
                        `;
                        bookingsList.appendChild(li);
                    });
                } else {
                    noBookingsMsg.style.display = 'block';
                }
            }

            // Show content, hide loading
            loadingProfile.style.display = 'none';
            profileContent.style.display = 'block';

        } catch (error) {
            console.error("Failed to load profile:", error);
            loadingProfile.style.display = 'none';
            profileError.textContent = `Error loading your information: ${error.message}`;
        }
    }

    // Load data when the page is ready
    document.addEventListener('DOMContentLoaded', loadProfileData);
    }

if(window.location.toString().indexOf("booking-success") != -1){
const loadingDiv = document.getElementById('booking-success-loading');
    const contentDiv = document.getElementById('booking-success-content');
    const errorDiv = document.getElementById('booking-success-error');
    const summaryDiv = document.getElementById('booking-summary');

    // Function to fetch and display details
    async function fetchBookingDetails(sessionId, retryCount = 0) {
        const maxRetries = 5; // Retry 5 times (e.g., every 3 seconds)
        const retryDelay = 3000; // 3 seconds
        const token = localStorage.getItem('authToken'); // Need token for protected endpoint

        if (!token) {
            errorDiv.textContent = "Error: Not logged in."; // Should ideally not happen if checkout required login
            loadingDiv.style.display = 'none';
            return;
        }
        if (!sessionId) {
             errorDiv.textContent = "Error: Missing checkout session information.";
             loadingDiv.style.display = 'none';
             return;
        }

        //console.log(`Fetching details for session ${sessionId}, attempt ${retryCount + 1}`);
        errorDiv.textContent = ''; // Clear previous errors

        try {
            const response = await fetch(`${backendApiUrl}/api/bookings/by-session/${sessionId}`, { // Relative or full URL
                headers: {
                    'Authorization': `Bearer ${token}`
                }
            });

            if (response.status === 401 || response.status === 403) {
                 throw new Error("Authentication error retrieving details.");
            }
             if (response.status === 404) {
                 throw new Error("Booking session not found.");
             }

            const data = await response.json();

            if (response.status === 202 && data.status === 'pending') {
                // Webhook likely hasn't finished processing yet
                if (retryCount < maxRetries) {
                    //console.log(`Booking details pending, retrying in ${retryDelay / 1000}s...`);
                     if(loadingDiv) loadingDiv.innerHTML = `<p>Finalizing booking details (Attempt ${retryCount + 2})... Please wait.</p>`; // Update loading message
                    setTimeout(() => fetchBookingDetails(sessionId, retryCount + 1), retryDelay);
                } else {
                    //console.log("Max retries reached. Showing pending message.");
                    loadingDiv.style.display = 'none';
                    errorDiv.innerHTML = `Your booking is being processed. Details may take a few moments to appear. Please check your <a href="/account">account page</a> shortly or contact us if needed.`;
                }
                return; // Stop processing this attempt
            }

            if (!response.ok || data.status !== 'success') {
                throw new Error(data.message || "Failed to load booking details.");
            }

            // --- Success: Display Details ---
            //console.log("Booking details received:", data);
            summaryDiv.innerHTML = ''; // Clear previous

            if (data.bookingType?.includes('playgroup')) {
                summaryDiv.innerHTML += `<p><strong>Service:</strong> Playgroup Semester</p>`;
                summaryDiv.innerHTML += `<p>Booked ${data.bookings.length} sessions.</p>`;
                // Optionally list the first few dates/times
                summaryDiv.innerHTML += `<ul>`;
                 data.bookings.slice(0, 5).forEach(b => { // Show first 5
                     const start = new Date(b.start);
                     summaryDiv.innerHTML += `<li>${start.toLocaleDateString([], { weekday: 'short', month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' })}</li>`;
                 });
                 if (data.bookings.length > 5) summaryDiv.innerHTML += `<li>...and more</li>`;
                 summaryDiv.innerHTML += `</ul>`;

            } else if (data.bookingType?.includes('openplay') && data.bookings.length > 0) {
                 const booking = data.bookings[0]; // Should only be one for drop-in/purchase record
                 const start = new Date(booking.start);
                 const end = new Date(booking.end);
                 const details = booking.details || {};
                 summaryDiv.innerHTML += `<p><strong>Service:</strong> Open Play (${details.option || 'N/A'})</p>`;
                 if (details.option === 'dropin') {
                     summaryDiv.innerHTML += `<p><strong>Date:</strong> ${start.toLocaleDateString([], { weekday: 'short', month: 'short', day: 'numeric' })}</p>`;
                     summaryDiv.innerHTML += `<p><strong>Time:</strong> ${start.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' })} - ${end.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' })}</p>`;
                 } else if (details.option === 'punchcard') {
                      summaryDiv.innerHTML += `<p>10 punches have been added to your account.</p>`;
                 } else if (details.option === 'membership') {
                      // Fetch user details again maybe? Or rely on info from account page.
                      summaryDiv.innerHTML += `<p>Your monthly membership is active.</p>`;
                 }
            } else if (data.bookingType === 'birthday' && data.bookings.length > 0) {
                 const booking = data.bookings[0];
                 const start = new Date(booking.start);
                 const end = new Date(booking.end);
                  summaryDiv.innerHTML += `<p><strong>Service:</strong> Birthday Party</p>`;
                  summaryDiv.innerHTML += `<p><strong>Date:</strong> ${start.toLocaleDateString([], { weekday: 'short', month: 'short', day: 'numeric' })}</p>`;
                  summaryDiv.innerHTML += `<p><strong>Time:</strong> ${start.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' })} - ${end.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' })}</p>`;
            }
             else {
                summaryDiv.innerHTML = `<p>Your booking is confirmed. Please check your email.</p>`; // Fallback
             }


            loadingDiv.style.display = 'none';
            contentDiv.style.display = 'block';


        } catch (error) {
            console.error("Fetch booking details error:", error);
            loadingDiv.style.display = 'none';
            errorDiv.textContent = `Error loading confirmation: ${error.message}. Please check your account page or contact support.`;
        }
    }

    // --- Get session_id from URL and load data ---
    document.addEventListener('DOMContentLoaded', () => {
        const urlParams = new URLSearchParams(window.location.search);
        const sessionId = urlParams.get('session_id');
        fetchBookingDetails(sessionId);
    });
