  async function fetchAvailableSlotsRange(serviceType) {
      if (!availableSlotsContainer || !loadingSlotsIndicator) {
          console.error("Missing elements for displaying slots range.");
          return;
      }

      loadingSlotsIndicator.classList.remove('hidden');
      availableSlotsContainer.innerHTML = ''; // Clear previous slots
      availableSlotsContainer.appendChild(loadingSlotsIndicator); // Show loading
      if (messagesDiv) messagesDiv.textContent = '';
      fetchedSlotsRange = {}; // Clear previous results
      resetOtherBooking(); // Reset any previously selected slot/cost

      try {
          const response = await fetch(`${backendApiUrl}/api/bookings/available-slots-range?serviceType=${serviceType}&days=${SLOT_RANGE_DAYS}`, {
              headers: { 'ngrok-skip-browser-warning': 'true' } // Header for ngrok
          });
          if (!response.ok) {
              const errorData = await response.json();
              throw new Error(errorData.message || `HTTP error! status: ${response.status}`);
          }
          fetchedSlotsRange = await response.json();

          displaySlotsRange();

      } catch (error) {
          console.error('Error fetching slots range:', error);
          loadingSlotsIndicator.classList.add('hidden');
          if (availableSlotsContainer) {
              availableSlotsContainer.innerHTML = `<p class="error">Could not load availability: ${error.message}. Please try again later.</p>`;
          }
      }
  }

  // *** NEW: Function to display the fetched slots range ***
  function displaySlotsRange() {
      if (!availableSlotsContainer || !loadingSlotsIndicator) return;

      loadingSlotsIndicator.classList.add('hidden'); // Hide loading
      availableSlotsContainer.innerHTML = ''; // Clear placeholder/loading

      const sortedDates = Object.keys(fetchedSlotsRange).sort(); // Sort dates chronologically

      if (sortedDates.length === 0 || sortedDates.every(date => fetchedSlotsRange[date].length === 0)) {
          availableSlotsContainer.innerHTML = '<p>No available slots found in the upcoming days.</p>';
          return;
      }

      sortedDates.forEach(dateStr => {
          const slots = fetchedSlotsRange[dateStr];
          if (slots.length > 0) {
              const dateHeader = document.createElement('h4');
              // Format date for display (e.g., "Mon, Sep 16")
              const dateObj = new Date(dateStr + 'T00:00:00'); // Parse as local date
              dateHeader.textContent = dateObj.toLocaleDateString([], { weekday: 'short', month: 'short', day: 'numeric' });
              dateHeader.style.marginTop = '15px'; // Add some spacing
              availableSlotsContainer.appendChild(dateHeader);

              slots.forEach(slot => {
                  const start = new Date(slot.start);
                  const end = new Date(slot.end);
                  const div = document.createElement('div');
                  div.classList.add('slot');
                  div.dataset.start = slot.start;
                  div.dataset.end = slot.end;
                  div.innerHTML = `
                      <span>${start.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' })} - ${end.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' })}</span>
                      `;
                      // <span>${start.toLocaleDateString()}</span> // Date is now in the header
                  availableSlotsContainer.appendChild(div);
              });
          }
          // Optional: Could add a message like "No slots available for [Date]" if slots array is empty for a date within the range
          else {
                const noSlotsMsg = document.createElement('p');
                noSlotsMsg.textContent = `No slots available for ${new Date(dateStr + 'T00:00:00').toLocaleDateString([], { weekday: 'short', month: 'short', day: 'numeric' })}`;
              noSlotsMsg.style.fontStyle = 'italic';
                noSlotsMsg.style.color = '#888';
                availableSlotsContainer.appendChild(noSlotsMsg);
           }
      });
  }

  function isSelectionValidForCheckout() {
      if (!selectedService) return false;

           return birthdayOption && !!selectedSlot; // Birthday needs option and slot
      }
      return false;
  }

  async function populatePlaygroupDaySelector() {
       // Ensure element exists
       if (!playgroupDaySelector) return;
       playgroupDaySelector.innerHTML = '<p class="loading">Loading schedule...</p>';
       playgroupSelections.daysBitmask = 0; // Reset selection
       playgroupSelections.scheduleIds = []; // Reset schedule IDs

      try {
           const response = await fetch(`${backendApiUrl}/api/class-schedules?serviceType=playgroup`,{
             headers: { 'ngrok-skip-browser-warning': 'true' } // Header for ngrok
           });
           if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
           const schedules = await response.json();
           const paymentOptionsDiv = document.getElementById('playgroup-payment-options-display');
           if (paymentOptionsDiv) paymentOptionsDiv.classList.add('hidden');
           if (!schedules || schedules.length === 0) {
               playgroupDaySelector.innerHTML = '<p>No playgroup schedules found.</p>';
               return;
           }

           playgroupDaySelector.innerHTML = '<p>Select Desired Day(s)/Time(s) for the Semester:</p>';
           const daysOfWeek = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];

           schedules.sort((a, b) => a.dayOfWeek - b.dayOfWeek || a.startTime.localeCompare(b.startTime));

           schedules.forEach(schedule => {
               const dayName = daysOfWeek[schedule.dayOfWeek];
               const time = `${schedule.startTime} - ${schedule.endTime}`;
               const bitValue = 1 << schedule.dayOfWeek;

               const div = document.createElement('div');
               div.classList.add('day-option');
               div.dataset.scheduleId = schedule._id;
               div.dataset.dayBit = bitValue;
               div.innerHTML = `
                   <input type="checkbox" id="schedule-${schedule._id}" data-schedule-id="${schedule._id}" data-day-bit="${bitValue}">
                   <label for="schedule-${schedule._id}">${dayName} ${time} (Capacity: ${schedule.capacity})</label>
               `;
               playgroupDaySelector.appendChild(div);

               const checkbox = div.querySelector('input[type="checkbox"]');
               checkbox.addEventListener('change', handlePlaygroupDaySelection);
           });

       } catch (error) {
           console.error("Error fetching playgroup schedule:", error);
           playgroupDaySelector.innerHTML = '<p class="error">Could not load playgroup schedule. Please try again later.</p>';
       }
   }

   // --- *** NEW/REVISED: Updates both payment display areas for Playgroup *** ---
   async function updatePlaygroupPaymentDisplays() {
      const paymentOptionsDiv = document.getElementById('playgroup-payment-options-display');
      const fullPaymentSummaryBox = document.getElementById('playgroup-cost-summary');
      const installmentDetailsBox = document.getElementById('installment-details');

      if (!paymentOptionsDiv || !fullPaymentSummaryBox || !installmentDetailsBox) return; // Ensure elements exist

      // Hide both initially if no days selected
      if (playgroupSelections.daysBitmask === 0) {
          paymentOptionsDiv.classList.add('hidden');
          return;
      }

      // Show the container
      paymentOptionsDiv.classList.remove('hidden');
      fullPaymentSummaryBox.classList.add('hidden'); // Hide specific boxes until calculated
      installmentDetailsBox.classList.add('hidden');

      // --- Calculate Full Payment Cost (for display) ---
      let calculatedFullCost = null;
      try {
          const response = await fetch(`${backendApiUrl}/api/pricing/calculate-playgroup`, {
              method: 'POST', headers: { 'Content-Type': 'application/json', 'ngrok-skip-browser-warning': 'true' },
              body: JSON.stringify({
                  semesterStartDate: playgroupSelections.semester.start,
                  semesterEndDate: playgroupSelections.semester.end,
                  daysPerWeekBitmask: playgroupSelections.daysBitmask,
                  paymentType: 'full' // Always calculate 'full' for display here
               })
          });
          if (!response.ok) throw new Error('Failed to calculate cost');
          calculatedFullCost = await response.json();

          // Display Full Payment Details
          populatePlaygroupFullCostUI(calculatedFullCost); // Use helper
          fullPaymentSummaryBox.classList.remove('hidden');

      } catch (error) {
          console.error('Error calculating playgroup cost for display:', error);
          if (messagesDiv) messagesDiv.textContent = `Error calculating cost: ${error.message}`;
          // Hide the full payment box on error
          fullPaymentSummaryBox.classList.add('hidden');
      }

      // --- Display Installment Info ---
      populatePlaygroupInstallmentUI(); // Use helper
      installmentDetailsBox.classList.remove('hidden');

      // Update overall checkout button state
      checkBookingLoginStatus();
  }

  function highlightSlotsForDate(dateStrToHighlight) { // dateStr is "YYYY-MM-DD"
       if (!availableSlotsContainer) return;
       availableSlotsContainer.querySelectorAll('.slot').forEach(slotDiv => {
           const slotStartDate = new Date(slotDiv.dataset.start).toISOString().split('T')[0];
           if (slotStartDate === dateStrToHighlight) {
               slotDiv.style.backgroundColor = '#e0f7ff'; // Example highlight
               slotDiv.style.border = '1px solid #007bff';
           } else {
               slotDiv.style.backgroundColor = ''; // Remove highlight
               slotDiv.style.border = '';
           }
       });
        // Optional: Scroll to the first highlighted slot or the date header
        const firstMatch = availableSlotsContainer.querySelector(`.slot[data-start^="${dateStrToHighlight}"]`);
        if(firstMatch) {
            firstMatch.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }
   }

  function handleServiceSelection(service) {
      selectedService = service;
      selectedSlot = null;
      // Ensure input exists before accessing value
      selectedDate = bookingDateInput ? bookingDateInput.value : null;
      playgroupSelections.calculatedCost = null;

      if(serviceButtons){
        serviceButtons.forEach(btn => btn.classList.remove('active'));
        const currentBtn = document.querySelector(`.service-selector button[data-service="${service}"]`);
        if(currentBtn) currentBtn.classList.add('active');
      }

      if (optionsContainer) optionsContainer.classList.remove('hidden');
      if (playgroupOptions) playgroupOptions.classList.add('hidden');
      if (otherOptions) otherOptions.classList.add('hidden');
      if (costSummaryDiv) costSummaryDiv.classList.add('hidden');
      if (paymentFormDiv) paymentFormDiv.classList.add('hidden');
      if (pgCostSummary) pgCostSummary.classList.add('hidden');
      if (availableSlotsContainer) availableSlotsContainer.innerHTML = '';
      if (messagesDiv) messagesDiv.textContent = '';

      fetchedSlotsRange = {};
      if (availableSlotsContainer) availableSlotsContainer.innerHTML = ''; // Clear slots display

      if (service === 'playgroup') {
          if (playgroupOptions) playgroupOptions.classList.remove('hidden');
          if (otherDateSelector) otherDateSelector.classList.add('hidden'); // Hide date picker for playgroup
          populatePlaygroupDaySelector();
      } else { // Open Play or Birthday
          if (otherOptions) otherOptions.classList.remove('hidden');
          if (otherServiceTitle) otherServiceTitle.textContent = service === 'openplay' ? 'Open Play Options' : 'Birthday Party Options';
          if (openPlayChoices) openPlayChoices.classList.toggle('hidden', service !== 'openplay');
          if (birthdayChoices) birthdayChoices.classList.toggle('hidden', service !== 'birthday');

          // Show date picker for filtering, but don't hide slots container yet
          if (otherDateSelector) otherDateSelector.classList.remove('hidden');

          // Reset option buttons
          if (openPlayChoices) openPlayChoices.querySelectorAll('button').forEach(b => b.classList.remove('active'));
          if (birthdayChoices) birthdayChoices.querySelectorAll('button').forEach(b => b.classList.remove('active'));

          // *** Immediately fetch and display slots for the range ***
          fetchAvailableSlotsRange(service);
      }
      checkBookingLoginStatus();
  }

    function handleOtherOptionSelection(event, serviceType) {
        if (!event.target.matches('button')) return;

        const button = event.target;
        const option = button.dataset.option;

        const buttonGroup = serviceType === 'openplay' ? openPlayChoices : birthdayChoices;
        if (buttonGroup) {
            buttonGroup.querySelectorAll('button').forEach(b => b.classList.remove('active'));
        }
        button.classList.add('active');


      resetOtherBooking(); // Reset slot/cost when option changes

      // Cost calculation and PaymentIntent creation for non-slot options (Punchcard/Membership)
      if (serviceType === 'openplay' && (option === 'punchcard' || option === 'membership')) {
          calculateOtherCost(option);
          if (availableSlotsContainer) availableSlotsContainer.innerHTML = '<i>Select membership/punchcard type. Proceed to checkout when ready.</i>';
          // Hide date selector and clear slots if they were for drop-in
          if (otherDateSelector) otherDateSelector.classList.add('hidden');
          if (availableSlotsContainer) availableSlotsContainer.innerHTML = '<p><i>Select membership/punchcard type above. Booking specific time slots is not required.</i></p>';

      } else {
          // For Drop-in or Birthday, slots are already displayed (or loading) by handleServiceSelection/fetchAvailableSlotsRange
          // Ensure date picker is visible
          if (otherDateSelector) otherDateSelector.classList.remove('hidden');
          // If slots were previously cleared by membership/punchcard, re-fetch/display them
           if (availableSlotsContainer && availableSlotsContainer.innerHTML.includes('not required')) {
               fetchAvailableSlotsRange(serviceType); // Re-fetch if needed
           }
      }
      checkBookingLoginStatus();
    }


    function handlePlaygroupDaySelection(event) {
        const checkbox = event.target;
        const scheduleId = checkbox.dataset.scheduleId;
        const dayBit = parseInt(checkbox.dataset.dayBit, 10);
        const dayOptionDiv = checkbox.closest('.day-option');

        if (checkbox.checked) {
            playgroupSelections.daysBitmask |= dayBit;
            if (!playgroupSelections.scheduleIds.includes(scheduleId)) {
                 playgroupSelections.scheduleIds.push(scheduleId);
            }
            if (dayOptionDiv) dayOptionDiv.classList.add('selected');
        } else {
            let dayStillSelected = false;
            if (playgroupDaySelector) {
                playgroupDaySelector.querySelectorAll(`input[data-day-bit="${dayBit}"]`).forEach(cb => {
                    if (cb.checked) dayStillSelected = true;
                });
            }
             if (!dayStillSelected) {
                 playgroupSelections.daysBitmask &= ~dayBit;
             }

            playgroupSelections.scheduleIds = playgroupSelections.scheduleIds.filter(id => id !== scheduleId);
             if (dayOptionDiv) dayOptionDiv.classList.remove('selected');
        }
        resetPlaygroupCost();
    }


    function handlePlaygroupAction() {
       if (!playgroupSelections.semester || playgroupSelections.daysBitmask === 0) {
           if (messagesDiv) messagesDiv.textContent = 'Please select a semester and at least one day/time.';
           return;

       const selectedPaymentType = playgroupSelections.paymentType;

       if (selectedPaymentType === 'full') {
           // For 'full', we calculate cost just for display, then rely on the main checkout button
           handleCalculatePlaygroupCostForDisplay(); // Calculate and display
       } else {
           // For 'installment', the button *itself* can trigger checkout immediately
           initiateCheckout(); // Trigger checkout directly
       }

  }

    async function fetchAvailableSlots() {
        // Ensure elements exist
        if (!availableSlotsContainer || !loadingSlotsIndicator) return;

        if (!selectedService || selectedService === 'playgroup' || !selectedDate) {
             availableSlotsContainer.innerHTML = '';
             return;
         }

        const openPlayOption = openPlayChoices ? openPlayChoices.querySelector('button.active')?.dataset.option : null;
        if (selectedService === 'openplay' && (openPlayOption === 'punchcard' || openPlayOption === 'membership')) {
            availableSlotsContainer.innerHTML = '';
            return;
        }

         loadingSlotsIndicator.classList.remove('hidden');
         availableSlotsContainer.innerHTML = ''; // Clear previous slots but keep loading indicator structure
         availableSlotsContainer.appendChild(loadingSlotsIndicator);
         if (messagesDiv) messagesDiv.textContent = '';
         resetOtherBooking();

         try {
             const response = await fetch(`${backendApiUrl}/api/bookings/available-slots?serviceType=${selectedService}&date=${selectedDate}`,{
                 headers: { 'ngrok-skip-browser-warning': 'true' } // Header for ngrok
             });
             if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
             const slots = await response.json();

             loadingSlotsIndicator.classList.add('hidden'); // Hide loading

             if (slots.length === 0) {
                 availableSlotsContainer.innerHTML = '<p>No available slots for this date.</p>';
             } else {
                 // Clear placeholder/loading before adding slots
                 availableSlotsContainer.innerHTML = '';
                 slots.forEach(slot => {
                     const start = new Date(slot.start);
                     const end = new Date(slot.end);
                     const div = document.createElement('div');
                     div.classList.add('slot');
                     div.dataset.start = slot.start;
                     div.dataset.end = slot.end;
                     div.innerHTML = `
                         <span>${start.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' })} - ${end.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' })}</span>
                         <span>${start.toLocaleDateString()}</span>
                     `;
                     availableSlotsContainer.appendChild(div);
                 });
             }
         } catch (error) {
             console.error('Error fetching slots:', error);
             loadingSlotsIndicator.classList.add('hidden');
             // Check element again before setting innerHTML
             if (availableSlotsContainer) {
                availableSlotsContainer.innerHTML = '<p class="error">Could not load slots. Please try again.</p>';
             }
         }
     }

   async function initiateCheckout() {
      if (!stripe) { if (messagesDiv) messagesDiv.textContent = "Payment system not loaded."; return; }
      if (!authToken) { if (messagesDiv) messagesDiv.textContent = "Please log in first."; return; }
      if (isCheckoutInProgress) return; // Prevent double clicks

      isCheckoutInProgress = true;
      if (checkoutButton) {
          checkoutButton.disabled = true;
          checkoutButton.textContent = 'Processing...';
      }
      if (messagesDiv) messagesDiv.textContent = 'Preparing secure checkout...';

      // --- Gather Data based on State ---
      let checkoutData = { serviceType: selectedService };

      if (selectedService === 'playgroup') {
          checkoutData = {
              ...checkoutData,
              paymentType: playgroupSelections.paymentType, // 'full' or 'installment'
              semesterDetails: playgroupSelections.semester,
              daysPerWeekBitmask: playgroupSelections.daysBitmask,
              scheduleIds: playgroupSelections.scheduleIds,
          };
      } else if (selectedService === 'openplay') {
          const openPlayOption = openPlayChoices?.querySelector('button.active')?.dataset.option;
          checkoutData.openPlayOption = openPlayOption;
          if (openPlayOption === 'dropin') {
              if (!selectedSlot) { /* handle error - shouldn't happen if button logic is right */ }
              checkoutData.selectedSlot = selectedSlot;
          }
      } else if (selectedService === 'birthday') {
          const partyDuration = 2; // Assuming fixed duration for now
           if (!selectedSlot) { /* handle error */ }
          checkoutData.selectedSlot = selectedSlot;
          checkoutData.partyDuration = partyDuration;
      } else {
          if (messagesDiv) messagesDiv.textContent = "Invalid service type selected.";
          isCheckoutInProgress = false;
          if (checkoutButton) { checkoutButton.disabled = false; checkoutButton.textContent = 'Proceed to Checkout'; }
          return;
      }



      try {
          // --- Call the unified backend endpoint ---
          const response = await fetch(`${backendApiUrl}/api/payments/create-checkout-session`, {
              method: 'POST',
              headers: {
                  'Content-Type': 'application/json',
                  'Authorization': `Bearer ${authToken}`,
                  'ngrok-skip-browser-warning': 'true'
              },
              body: JSON.stringify(checkoutData)
          });

          if (!response.ok) {
              const errorData = await response.json();
              throw new Error(errorData.message || `Failed to initiate checkout (Status: ${response.status})`);
          }

          const { sessionId } = await response.json();

          // --- Redirect to Stripe Checkout ---
          if (sessionId) {
              const { error } = await stripe.redirectToCheckout({ sessionId: sessionId });
              if (error) {
                  // This error typically occurs client-side before the redirect happens
                  throw new Error(`Checkout redirect failed: ${error.message}`);
              }
              // If redirect succeeds, browser navigates away. Code below here may not run reliably.
              // Reset button state in case user navigates back without completing checkout
              // isCheckoutInProgress = false;
              // if (checkoutButton) { checkoutButton.disabled = false; checkoutButton.textContent = 'Proceed to Checkout'; }
          } else {
               throw new Error("No session ID received from server.");
          }

      } catch (error) {
          console.error('Error initiating checkout:', error);
          if (messagesDiv) messagesDiv.textContent = `Error: ${error.message}`;
          isCheckoutInProgress = false; // Re-enable button on error
          if (checkoutButton) {
              checkoutButton.disabled = false;
              // Restore appropriate text based on context
               checkoutButton.textContent = (selectedService === 'playgroup' && playgroupSelections.paymentType === 'installment')
                  ? 'Retry Payment Setup' : 'Proceed to Checkout';
          }
      }
  }

            // Show content, hide loading
            loadingProfile.style.display = 'none';
            profileContent.style.display = 'block';

        } catch (error) {
            console.error("Failed to load profile:", error);
            loadingProfile.style.display = 'none';
            profileError.textContent = `Error loading your information: ${error.message}`;
        }
    }

    // Load data when the page is ready
    document.addEventListener('DOMContentLoaded', loadProfileData);
    }
</script>
