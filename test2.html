  // REMOVED: initializeStripe (Stripe Elements specific)

  function checkBookingLoginStatus() {
      authToken = localStorage.getItem('authToken');
      const canProceed = isSelectionValidForCheckout(); // Check if a valid selection is made

      if (loginPromptDiv && checkoutButton) {
          if (!authToken) {
              loginPromptDiv.classList.remove('hidden');
              checkoutButton.classList.add('hidden'); // Hide checkout button if not logged in
              checkoutButton.disabled = true;
          } else {
              loginPromptDiv.classList.add('hidden');
              // Show checkout button ONLY if a valid selection is made
              checkoutButton.classList.toggle('hidden', !canProceed);
              checkoutButton.disabled = !canProceed || isCheckoutInProgress; // Disable if no selection or busy
          }
      }
       // Hide the overall payment form container if user isn't logged in OR no valid selection
       if (paymentFormDiv) {
           paymentFormDiv.classList.toggle('hidden', !authToken || !canProceed);
       }

  // Helper to determine if the current state allows proceeding to checkout
  function isSelectionValidForCheckout() {
        if (!selectedService) return false;

        if (selectedService === 'playgroup') {
            return playgroupSelections.semester && playgroupSelections.daysBitmask > 0;
        } else if (selectedService === 'openplay') {
            const openPlayOption = openPlayChoices?.querySelector('button.active')?.dataset.option;
            if (!openPlayOption) return false; // Must select an option
            return openPlayOption === 'dropin' ? !!selectedSlot : true; // Drop-in needs slot, others don't
        } else if (selectedService === 'birthday') {
             const birthdayOption = birthdayChoices?.querySelector('button.active')?.dataset.option;
             return birthdayOption && !!selectedSlot; // Birthday needs option and slot
        }
        return false;
    }

      if (openPlayChoices) {

  // Renamed handler for the playgroup button
  function handlePlaygroupAction() {
       if (!playgroupSelections.semester || playgroupSelections.daysBitmask === 0) {
           if (messagesDiv) messagesDiv.textContent = 'Please select a semester and at least one day/time.';
           return;
       }

       const selectedPaymentType = playgroupSelections.paymentType;

       if (selectedPaymentType === 'full') {
           // For 'full', we calculate cost just for display, then rely on the main checkout button
           handleCalculatePlaygroupCostForDisplay(); // Calculate and display
       } else {
           // For 'installment', the button *itself* can trigger checkout immediately
           initiateCheckout(); // Trigger checkout directly
       }
       checkBookingLoginStatus(); // Update checkout button visibility/state
  }

  // Calculates and displays cost for Playgroup 'Full', enables checkout button
  async function handleCalculatePlaygroupCostForDisplay() {
       if (calculateCostBtn) {
           calculateCostBtn.disabled = true;
           calculateCostBtn.textContent = 'Calculating Cost...';
       }
       if (messagesDiv) messagesDiv.textContent = '';
       if (pgCostSummary) pgCostSummary.classList.add('hidden');
       // Don't hide main payment form, just update cost summary
       // if (paymentFormDiv) paymentFormDiv.classList.add('hidden');

       try {
            const response = await fetch(`${backendApiUrl}/api/pricing/calculate-playgroup`, {
                method: 'POST', headers: { 'Content-Type': 'application/json', 'ngrok-skip-browser-warning': 'true' },
                body: JSON.stringify({ /* semester details, bitmask, paymentType='full' */
                    semesterStartDate: playgroupSelections.semester.start,
                    semesterEndDate: playgroupSelections.semester.end,
                    daysPerWeekBitmask: playgroupSelections.daysBitmask,
                    paymentType: 'full' // Calculate as full payment
                 })
            });
            if (!response.ok) { /* handle error */ throw new Error( (await response.json()).message || 'HTTP error'); }

            const costDetails = await response.json();
            playgroupSelections.calculatedCost = costDetails; // Store for reference/display

            if (pgCostDetails) pgCostDetails.textContent = JSON.stringify(costDetails, null, 2);
            if (pgCostSummary) pgCostSummary.classList.remove('hidden');
            console.log("Full Playgroup Cost Calculated:", costDetails);

            // Update UI based on login status (enables/shows checkout button)
            checkBookingLoginStatus();

       } catch (error) { /* handle error */ }
       finally {
            if (calculateCostBtn) {
                 calculateCostBtn.disabled = false;
                 calculateCostBtn.textContent = 'Recalculate Cost'; // Or similar
            }
       }
   }

  // --- *** NEW: Unified Checkout Initiation *** ---
  async function initiateCheckout() {
      if (!stripe) { if (messagesDiv) messagesDiv.textContent = "Payment system not loaded."; return; }
      if (!authToken) { if (messagesDiv) messagesDiv.textContent = "Please log in first."; return; }
      if (isCheckoutInProgress) return; // Prevent double clicks

      console.log("Initiating checkout...");
      isCheckoutInProgress = true;
      if (checkoutButton) {
          checkoutButton.disabled = true;
          checkoutButton.textContent = 'Processing...';
      }
      if (messagesDiv) messagesDiv.textContent = 'Preparing secure checkout...';

      // --- Gather Data based on State ---
      let checkoutData = { serviceType: selectedService };

      if (selectedService === 'playgroup') {
          checkoutData = {
              ...checkoutData,
              paymentType: playgroupSelections.paymentType, // 'full' or 'installment'
              semesterDetails: playgroupSelections.semester,
              daysPerWeekBitmask: playgroupSelections.daysBitmask,
              scheduleIds: playgroupSelections.scheduleIds,
          };
      } else if (selectedService === 'openplay') {
          const openPlayOption = openPlayChoices?.querySelector('button.active')?.dataset.option;
          checkoutData.openPlayOption = openPlayOption;
          if (openPlayOption === 'dropin') {
              if (!selectedSlot) { /* handle error - shouldn't happen if button logic is right */ }
              checkoutData.selectedSlot = selectedSlot;
          }
      } else if (selectedService === 'birthday') {
          const partyDuration = 2; // Assuming fixed duration for now
           if (!selectedSlot) { /* handle error */ }
          checkoutData.selectedSlot = selectedSlot;
          checkoutData.partyDuration = partyDuration;
      } else {
          if (messagesDiv) messagesDiv.textContent = "Invalid service type selected.";
          isCheckoutInProgress = false;
          if (checkoutButton) { checkoutButton.disabled = false; checkoutButton.textContent = 'Proceed to Checkout'; }
          return;
      }

      console.log("Data for checkout:", checkoutData);

      try {
          // --- Call the unified backend endpoint ---
          const response = await fetch(`${backendApiUrl}/api/payments/create-checkout-session`, {
              method: 'POST',
              headers: {
                  'Content-Type': 'application/json',
                  'Authorization': `Bearer ${authToken}`,
                  'ngrok-skip-browser-warning': 'true'
              },
              body: JSON.stringify(checkoutData)
          });

          if (!response.ok) {
              const errorData = await response.json();
              throw new Error(errorData.message || `Failed to initiate checkout (Status: ${response.status})`);
          }

          const { sessionId } = await response.json();

          // --- Redirect to Stripe Checkout ---
          if (sessionId) {
              console.log("Redirecting to Stripe Checkout, Session:", sessionId);
              const { error } = await stripe.redirectToCheckout({ sessionId: sessionId });
              if (error) {
                  // This error typically occurs client-side before the redirect happens
                  throw new Error(`Checkout redirect failed: ${error.message}`);
              }
              // If redirect succeeds, browser navigates away. Code below here may not run reliably.
              // Reset button state in case user navigates back without completing checkout
              // isCheckoutInProgress = false;
              // if (checkoutButton) { checkoutButton.disabled = false; checkoutButton.textContent = 'Proceed to Checkout'; }
          } else {
               throw new Error("No session ID received from server.");
          }

      } catch (error) {
          console.error('Error initiating checkout:', error);
          if (messagesDiv) messagesDiv.textContent = `Error: ${error.message}`;
          isCheckoutInProgress = false; // Re-enable button on error
          if (checkoutButton) {
              checkoutButton.disabled = false;
              // Restore appropriate text based on context
               checkoutButton.textContent = (selectedService === 'playgroup' && playgroupSelections.paymentType === 'installment')
                  ? 'Retry Payment Setup' : 'Proceed to Checkout';
          }
      }
  }
